<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChatsParty Overlay</title>
    <style>
      :root {
        --cp-accent: #d0bcff;
        --cp-font: system-ui, 'Microsoft YaHei', 'PingFang SC', sans-serif;
        /*
          两个缩放单位，设置页里那两个滑块改的就是它们：
          --cp-u   界面大小百分比 —— 头像、间距、圆角、阴影都乘它
          --cp-fs  界面大小 × 字体大小 —— 只有字号乘它
          分开是为了能「框放大但字不变」或只把字改大。默认 1px 即原始尺寸。
        */
        --cp-u: 1px;
        --cp-fs: 1px;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: transparent;
        font-family: var(--cp-font);
        overflow: hidden;
      }

      /* top / bottom 由脚本里的 layout() 动态内缩：把点歌面板和歌词占掉的那几段让出去，
         这样弹幕再怎么堆也不会压到它们身上。overflow: hidden 是最后一道保险 ——
         万一还是塞不下，宁可切掉离角落最远的那几条，也不许糊到别的块上。 */
      #app {
        position: fixed;
        inset: 0;
        display: flex;
        padding: calc(24 * var(--cp-u));
        box-sizing: border-box;
        overflow: hidden;
        gap: calc(8 * var(--cp-u));
        /* 缺省 = 右下：竖排、贴底、靠右 */
        flex-direction: column;
        justify-content: flex-end;
        align-items: flex-end;
      }

      /*
        四个角落。垂直方向要连带翻转堆叠顺序：
        新消息是 appendChild 进去的（DOM 末尾），我们希望它永远紧贴所选的那个角，
        所以下半区用 column（末尾在底），上半区用 column-reverse（末尾在顶）。
        注意 column-reverse 会把主轴倒过来，贴顶反而要写 flex-end。
        这样 trim() 删 firstChild 时，消失的永远是离角落最远、最老的那条。
      */
      #app[data-pos='tl'],
      #app[data-pos='tr'] {
        flex-direction: column-reverse;
      }

      /* 水平：l 靠左、r 靠右（交叉轴不受 column-reverse 影响） */
      #app[data-pos='tl'],
      #app[data-pos='bl'] {
        align-items: flex-start;
      }

      .cp-item {
        display: flex;
        align-items: flex-start;
        gap: calc(10 * var(--cp-u));
        max-width: calc(460 * var(--cp-u));
        padding: calc(10 * var(--cp-u)) calc(14 * var(--cp-u));
        border-radius: calc(14 * var(--cp-u));
        background: rgba(18, 18, 22, 0.62);
        backdrop-filter: blur(calc(6 * var(--cp-u)));
        -webkit-backdrop-filter: blur(calc(6 * var(--cp-u)));
        color: #f4f2f6;
        box-shadow: 0 calc(2 * var(--cp-u)) calc(10 * var(--cp-u)) rgba(0, 0, 0, 0.28);
        animation: cp-in 260ms cubic-bezier(0.2, 0, 0, 1);
      }

      @keyframes cp-in {
        from {
          opacity: 0;
          transform: translateX(calc(24 * var(--cp-u)));
        }
        to {
          opacity: 1;
          transform: translateX(0);
        }
      }

      /* 贴在左边时改从这个方向滑进来 */
      @keyframes cp-in-left {
        from {
          opacity: 0;
          transform: translateX(-24px);
        }
        to {
          opacity: 1;
          transform: translateX(0);
        }
      }

      .cp-item.is-gift {
        background: rgba(96, 62, 24, 0.66);
      }
      .cp-item.is-superchat {
        background: rgba(58, 40, 96, 0.72);
        border-left: calc(3 * var(--cp-u)) solid var(--cp-accent);
      }
      .cp-item.is-guard {
        background: rgba(114, 30, 30, 0.66);
      }

      .cp-face {
        width: calc(34 * var(--cp-u));
        height: calc(34 * var(--cp-u));
        flex: 0 0 calc(34 * var(--cp-u));
        border-radius: 50%;
        object-fit: cover;
        background: rgba(255, 255, 255, 0.12);
      }

      .cp-face--none {
        display: grid;
        place-items: center;
        font-size: calc(13 * var(--cp-fs));
        color: rgba(255, 255, 255, 0.7);
      }

      .cp-body {
        min-width: 0;
        flex: 1;
      }

      .cp-head {
        display: flex;
        align-items: center;
        gap: calc(6 * var(--cp-u));
        margin-bottom: calc(2 * var(--cp-u));
        flex-wrap: wrap;
      }

      .cp-name {
        font-size: calc(13 * var(--cp-fs));
        font-weight: 600;
        color: var(--cp-accent);
        text-shadow: 0 calc(1 * var(--cp-u)) calc(2 * var(--cp-u)) rgba(0, 0, 0, 0.5);
      }

      .cp-medal {
        font-size: calc(11 * var(--cp-fs));
        padding: calc(1 * var(--cp-u)) calc(6 * var(--cp-u));
        border-radius: calc(6 * var(--cp-u));
        background: rgba(255, 255, 255, 0.14);
        color: #fff;
      }

      .cp-price {
        font-size: calc(11 * var(--cp-fs));
        padding: calc(1 * var(--cp-u)) calc(6 * var(--cp-u));
        border-radius: calc(6 * var(--cp-u));
        background: rgba(255, 255, 255, 0.2);
        color: #fff;
      }

      .cp-text {
        font-size: calc(16 * var(--cp-fs));
        line-height: 1.5;
        word-break: break-word;
        text-shadow: 0 calc(1 * var(--cp-u)) calc(3 * var(--cp-u)) rgba(0, 0, 0, 0.6);
      }

      .cp-text img {
        height: calc(24 * var(--cp-u));
        vertical-align: middle;
      }

      /*
        贴右侧时整条镜像：头像挪到右、文字右对齐、头衔组反向排、
        醒目留言的强调边从左改到右、进场方向改从右往左。
        凡是原先默认靠左的约定都得跟着掉个儿，否则看着像排版坏了。
        两侧都显式写死 left / right 而不吃初始值 start —— 一旦有别的地方改了
        direction，start 会跟着反向，这里要的是钉死的物理方向。
      */
      #app[data-pos='tl'] .cp-item,
      #app[data-pos='bl'] .cp-item {
        text-align: left;
      }
      #app[data-pos='tr'] .cp-item,
      #app[data-pos='br'] .cp-item {
        flex-direction: row-reverse;
        text-align: right;
      }

      #app[data-pos='tr'] .cp-head,
      #app[data-pos='br'] .cp-head {
        flex-direction: row-reverse;
      }

      #app[data-pos='tr'] .cp-item.is-superchat,
      #app[data-pos='br'] .cp-item.is-superchat {
        border-left: none;
        border-right: calc(3 * var(--cp-u)) solid var(--cp-accent);
      }

      #app[data-pos='tl'] .cp-item,
      #app[data-pos='bl'] .cp-item {
        animation-name: cp-in-left;
      }

      /* ---------- 点歌面板 ----------
         这套 class 名与 src/components/MusicWidget.tsx、src/styles.css 里的是同一份，
         弹幕页的预览照着它渲染。改样式两边一起改，否则预览和 OBS 会对不上。 */
      .cp-music {
        position: fixed;
        display: none;
        flex-direction: column;
        gap: calc(8 * var(--cp-u));
        width: calc(300 * var(--cp-u));
        max-width: 42vw;
        font-family: var(--cp-font);
        pointer-events: none;
      }

      .cp-music.is-show {
        display: flex;
      }

      .cp-music[data-pos='tl'] {
        left: calc(24 * var(--cp-u));
        top: calc(24 * var(--cp-u));
      }
      .cp-music[data-pos='tr'] {
        right: calc(24 * var(--cp-u));
        top: calc(24 * var(--cp-u));
      }
      .cp-music[data-pos='bl'] {
        left: calc(24 * var(--cp-u));
        bottom: calc(24 * var(--cp-u));
      }
      .cp-music[data-pos='br'] {
        right: calc(24 * var(--cp-u));
        bottom: calc(24 * var(--cp-u));
      }

      .cp-mcard,
      .cp-mqueue {
        padding: calc(10 * var(--cp-u)) calc(14 * var(--cp-u));
        border-radius: calc(14 * var(--cp-u));
        background: rgba(18, 18, 22, 0.62);
        backdrop-filter: blur(calc(6 * var(--cp-u)));
        -webkit-backdrop-filter: blur(calc(6 * var(--cp-u)));
        color: #f4f2f6;
        box-shadow: 0 calc(2 * var(--cp-u)) calc(10 * var(--cp-u)) rgba(0, 0, 0, 0.28);
        animation: cp-in 260ms cubic-bezier(0.2, 0, 0, 1);
      }

      .cp-mcard {
        display: flex;
        align-items: center;
        gap: calc(10 * var(--cp-u));
      }

      .cp-mcover {
        width: calc(48 * var(--cp-u));
        height: calc(48 * var(--cp-u));
        flex: 0 0 calc(48 * var(--cp-u));
        border-radius: calc(10 * var(--cp-u));
        overflow: hidden;
        background: rgba(255, 255, 255, 0.12);
        display: grid;
        place-items: center;
      }

      .cp-mcover img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      .cp-mcover__none {
        font-size: calc(20 * var(--cp-fs));
        color: rgba(255, 255, 255, 0.55);
      }

      .cp-mbody {
        min-width: 0;
        flex: 1;
      }

      .cp-mlabel {
        font-size: calc(11 * var(--cp-fs));
        opacity: 0.62;
        letter-spacing: calc(0.5 * var(--cp-u));
        margin-bottom: calc(1 * var(--cp-u));
      }

      .cp-mtitle {
        font-size: calc(15 * var(--cp-fs));
        font-weight: 600;
        line-height: 1.35;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        text-shadow: 0 calc(1 * var(--cp-u)) calc(3 * var(--cp-u)) rgba(0, 0, 0, 0.6);
      }

      .cp-msub {
        font-size: calc(12 * var(--cp-fs));
        opacity: 0.78;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        text-shadow: 0 calc(1 * var(--cp-u)) calc(2 * var(--cp-u)) rgba(0, 0, 0, 0.5);
      }

      .cp-mqueue__head {
        margin-bottom: calc(4 * var(--cp-u));
      }

      .cp-mrow {
        display: flex;
        align-items: baseline;
        gap: calc(6 * var(--cp-u));
        font-size: calc(13 * var(--cp-fs));
        line-height: 1.6;
        min-width: 0;
      }

      .cp-mrow__no {
        flex: 0 0 calc(14 * var(--cp-u));
        font-size: calc(11 * var(--cp-fs));
        opacity: 0.55;
        text-align: right;
      }

      .cp-mrow__name {
        flex: 1;
        min-width: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        text-shadow: 0 calc(1 * var(--cp-u)) calc(2 * var(--cp-u)) rgba(0, 0, 0, 0.5);
      }

      .cp-mrow__who {
        flex: 0 0 auto;
        max-width: 34%;
        font-size: calc(11 * var(--cp-fs));
        opacity: 0.62;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      /* ---------- 歌词 ----------
         行往中间不一定好看，所以位置单独可配：默认底部居中，像演唱会字幕。
         当前一句高亮放大，后面几句压暗 —— 一眼能看出唱到哪了。 */
      .cp-lyric {
        position: fixed;
        display: none;
        flex-direction: column;
        gap: calc(4 * var(--cp-u));
        width: 76%;
        max-width: calc(1100 * var(--cp-u));
        font-family: var(--cp-font);
        text-align: center;
        pointer-events: none;
      }

      .cp-lyric.is-show {
        display: flex;
      }

      .cp-lyric[data-pos='tc'] {
        left: 50%;
        top: calc(24 * var(--cp-u));
        transform: translateX(-50%);
      }
      .cp-lyric[data-pos='bc'] {
        left: 50%;
        bottom: calc(24 * var(--cp-u));
        transform: translateX(-50%);
      }
      .cp-lyric[data-pos='tl'] {
        left: calc(24 * var(--cp-u));
        top: calc(24 * var(--cp-u));
        text-align: left;
      }
      .cp-lyric[data-pos='tr'] {
        right: calc(24 * var(--cp-u));
        top: calc(24 * var(--cp-u));
        text-align: right;
      }
      .cp-lyric[data-pos='bl'] {
        left: calc(24 * var(--cp-u));
        bottom: calc(24 * var(--cp-u));
        text-align: left;
      }
      .cp-lyric[data-pos='br'] {
        right: calc(24 * var(--cp-u));
        bottom: calc(24 * var(--cp-u));
        text-align: right;
      }

      .cp-lyric__line {
        font-size: calc(22 * var(--cp-fs));
        font-weight: 600;
        line-height: 1.35;
        color: #fff;
        opacity: 0.42;
        text-shadow: 0 calc(2 * var(--cp-u)) calc(6 * var(--cp-u)) rgba(0, 0, 0, 0.8);
        transition: opacity 240ms ease, transform 240ms ease;
        transform-origin: center;
      }

      /* 唱到的一句：提亮、放大一点点。左右贴边时缩小不能改变宽度的参照，所以只动 opacity */
      .cp-lyric__line.is-cur {
        opacity: 1;
        transform: scale(1.06);
      }

      .cp-lyric[data-pos='tc'] .cp-lyric__line,
      .cp-lyric[data-pos='bc'] .cp-lyric__line {
        transform-origin: center;
      }

      /* ---------- 音色选择面板 ----------
         观众发「#音色列表 关键词」时，把候选摆到画面上供他挑；他再发「#绑定 2」，
         第 2 条就会被标出来。一次只显示一条，后面还排着队就在底下提一声。
         这套 class 名与 src/components/VoicePickPreview.tsx 用的是同一份，
         设置页的预览照着它渲染 —— 改样式两边一起改。 */
      .cp-pick {
        position: fixed;
        display: none;
        flex-direction: column;
        width: calc(300 * var(--cp-u));
        max-width: 42vw;
        font-family: var(--cp-font);
        pointer-events: none;
        animation: cp-pick-in 220ms cubic-bezier(0.2, 0, 0, 1);
      }

      .cp-pick.is-show {
        display: flex;
      }

      .cp-pick[data-pos='tl'] {
        left: calc(24 * var(--cp-u));
        top: calc(24 * var(--cp-u));
      }
      .cp-pick[data-pos='tr'] {
        right: calc(24 * var(--cp-u));
        top: calc(24 * var(--cp-u));
      }
      .cp-pick[data-pos='bl'] {
        left: calc(24 * var(--cp-u));
        bottom: calc(24 * var(--cp-u));
      }
      .cp-pick[data-pos='br'] {
        right: calc(24 * var(--cp-u));
        bottom: calc(24 * var(--cp-u));
      }

      /* 方向无关的进场：淡入 + 轻微放大。用 cp-in 那套左右位移的话，
         贴左边的面板会从画面外滑进来 */
      @keyframes cp-pick-in {
        from {
          opacity: 0;
          transform: scale(0.97);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }

      .cp-pick__card {
        padding: calc(10 * var(--cp-u)) calc(14 * var(--cp-u)) calc(12 * var(--cp-u));
        border-radius: calc(14 * var(--cp-u));
        background: rgba(18, 18, 22, 0.62);
        backdrop-filter: blur(calc(6 * var(--cp-u)));
        -webkit-backdrop-filter: blur(calc(6 * var(--cp-u)));
        color: #f4f2f6;
        box-shadow: 0 calc(2 * var(--cp-u)) calc(10 * var(--cp-u)) rgba(0, 0, 0, 0.28);
      }

      .cp-pick__head {
        display: flex;
        align-items: baseline;
        gap: calc(6 * var(--cp-u));
        margin-bottom: calc(6 * var(--cp-u));
      }

      .cp-pick__who {
        font-size: calc(13 * var(--cp-fs));
        font-weight: 600;
        white-space: nowrap;
        text-shadow: 0 calc(1 * var(--cp-u)) calc(3 * var(--cp-u)) rgba(0, 0, 0, 0.6);
      }

      .cp-pick__kw {
        min-width: 0;
        font-size: calc(12 * var(--cp-fs));
        opacity: 0.62;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .cp-pick__row {
        display: flex;
        align-items: baseline;
        gap: calc(8 * var(--cp-u));
        padding: calc(3 * var(--cp-u)) calc(6 * var(--cp-u));
        border-radius: calc(8 * var(--cp-u));
        font-size: calc(13 * var(--cp-fs));
        line-height: 1.45;
        min-width: 0;
      }

      .cp-pick__no {
        flex: 0 0 calc(14 * var(--cp-u));
        font-size: calc(11 * var(--cp-fs));
        opacity: 0.55;
        text-align: right;
      }

      .cp-pick__name {
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .cp-pick__meta {
        flex: 1;
        min-width: 0;
        font-size: calc(11 * var(--cp-fs));
        opacity: 0.6;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .cp-pick__tag {
        flex: 0 0 auto;
        padding: calc(1 * var(--cp-u)) calc(6 * var(--cp-u));
        border-radius: calc(999 * var(--cp-u));
        font-size: calc(10 * var(--cp-fs));
        background: rgba(255, 255, 255, 0.14);
      }

      /* 库里有、但被主播停用了：这是「点了却没反应」的头号原因，必须显眼 */
      .cp-pick__tag.is-off {
        background: rgba(190, 70, 70, 0.42);
      }

      /* 他挑中的那条：提亮 + 描边 */
      .cp-pick__row.is-picked {
        background: rgba(208, 188, 255, 0.26);
        box-shadow: inset 0 0 0 calc(1 * var(--cp-u)) var(--cp-accent);
      }

      .cp-pick__row.is-picked .cp-pick__name,
      .cp-pick__row.is-picked .cp-pick__meta {
        opacity: 1;
      }

      .cp-pick__row.is-off {
        opacity: 0.5;
      }

      .cp-pick__ok {
        flex: 0 0 auto;
        font-size: calc(11 * var(--cp-fs));
        font-weight: 600;
        color: var(--cp-accent);
      }

      .cp-pick__fail {
        margin-top: calc(6 * var(--cp-u));
        font-size: calc(11 * var(--cp-fs));
        color: #ffb4ab;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .cp-pick__wait {
        margin-top: calc(6 * var(--cp-u));
        font-size: calc(11 * var(--cp-fs));
        opacity: 0.6;
      }

      /* 倒计时进度条：时长由脚本按配置写成 animation-duration，
         跟主进程那边「这一条还剩几秒」对得上 */
      .cp-pick__bar {
        margin-top: calc(8 * var(--cp-u));
        height: calc(2 * var(--cp-u));
        border-radius: calc(999 * var(--cp-u));
        background: rgba(255, 255, 255, 0.14);
        overflow: hidden;
      }

      .cp-pick__bar-fill {
        width: 100%;
        height: 100%;
        background: var(--cp-accent);
        animation: cp-pick-countdown linear forwards;
      }

      @keyframes cp-pick-countdown {
        from {
          width: 100%;
        }
        to {
          width: 0%;
        }
      }

      /* ---------- 窄画面 ----------
         比如把 OBS 浏览器源拖成一条竖带。三块谁站哪一段由脚本里的 layout() 算，
         这里只负责把宽度放开：上面那套尺寸是按 1080p 画布定的，窄条上会顶出画面。 */
      html.is-narrow .cp-item {
        max-width: 100%;
        /* 画面窄、字号又调得大时，一句话能折成十几行，比留给弹幕的那一段还高。
           上限按容器高度取，宁可它自己截断，也不许顶到歌词上去 */
        max-height: 100%;
        overflow: hidden;
      }

      html.is-narrow .cp-music {
        max-width: calc(100% - 48 * var(--cp-u));
        /* 队列长起来时把面板本身截住，别让它一口气把弹幕那段挤没 */
        max-height: 46%;
        overflow: hidden;
      }

      html.is-narrow .cp-lyric {
        width: calc(100% - 48 * var(--cp-u));
        max-width: none;
        /* 窄条上字号一放大，两三行就能顶掉半屏。截掉的是后面几句预告，
           当前正在唱的那句在第一个，永远看得到 */
        max-height: 28%;
        overflow: hidden;
      }

      html.is-narrow .cp-pick {
        max-width: calc(100% - 48 * var(--cp-u));
        /* 候选多 + 字号大时把面板本身截住，别把弹幕那一段挤没。
           截掉的是后面的候选，序号小的永远看得到 */
        max-height: 42%;
        overflow: hidden;
      }

      #cp-custom-style {
        display: none;
      }

      /* 连接状态提示：断线时常驻，连上后 3 秒自动淡出，不干扰画面 */
      #cp-status {
        position: fixed;
        left: calc(24 * var(--cp-u));
        bottom: calc(24 * var(--cp-u));
        padding: calc(6 * var(--cp-u)) calc(12 * var(--cp-u));
        border-radius: calc(999 * var(--cp-u));
        font-size: calc(13 * var(--cp-fs));
        font-family: var(--cp-font);
        background: rgba(18, 18, 22, 0.78);
        color: #f4f2f6;
        opacity: 0;
        transition: opacity 300ms ease;
        pointer-events: none;
      }

      #cp-status.is-show {
        opacity: 1;
      }

      #cp-status.is-bad {
        background: rgba(150, 26, 26, 0.85);
      }
      /* ---------- 拆开成单独的浏览器源 ----------
         一块单占一个 OBS 源时，这个源里就它一份，不用再给谁腾地方：
         原来那几个百分比上限（歌词 28% / 音色 42% / 点歌 46%）是「三块同挤一个
         画布」时定的，现在整块源都是它的，全部放开。
         这几条放在 .is-narrow 那一组**后面** —— 两边同时命中时选择器权重一样，
         靠顺序取胜，所以顺序不能调。 */
      html.is-panel .cp-lyric {
        /* 字幕该占满整个源：主播把源拉多宽，字就跟着走 */
        width: 100%;
        max-width: none;
        max-height: 100%;
        overflow: hidden;
      }

      html.is-panel .cp-music,
      html.is-panel .cp-pick {
        /* 宽度保留各自的原生尺寸（卡片拉满整屏很难看），只把上限放开，
           免得源一窄就被 42vw 卡住 */
        max-width: 100%;
        max-height: 100%;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div id="app" data-pos="br"></div>
    <div id="cp-music" class="cp-music" data-pos="tl"></div>
    <div id="cp-lyric" class="cp-lyric" data-pos="bc"></div>
    <div id="cp-pick" class="cp-pick" data-pos="tr"></div>
    <div id="cp-status"></div>
    <style id="cp-custom-style"></style>

    <script>
      /* ---------------------------- 我是哪一块 ----------------------------
         同一个页面被多个 OBS 浏览器源共用，靠 URL 认身份：
           /overlay            全部（老行为：三块齐全 + 自动避让）
           /overlay/danmaku    只画弹幕
           /overlay/lyric      只画歌词
           /overlay/music      只画点歌面板
           /overlay/voicepick  只画音色选择面板
         ?panel=lyric 这种写法也认，方便手敲。认不得的一律按「全部」走 ——
         宁可多画一块，也不能因为写错一个字母给主播一个纯透明页。 */
      const PANELS = ['all', 'danmaku', 'lyric', 'music', 'voicepick']
      const PANEL = (function () {
        const m = location.pathname.match(/\/overlay\/([A-Za-z]+)/)
        const q = new URLSearchParams(location.search).get('panel')
        const v = String((m && m[1]) || q || 'all').toLowerCase()
        return PANELS.indexOf(v) >= 0 ? v : 'all'
      })()
      /** true = 这个源只负责一块 */
      const ONLY = PANEL !== 'all'
      /** 这块该不该由本页负责 */
      function shows(name) {
        return !ONLY || PANEL === name
      }
      if (ONLY) {
        document.documentElement.classList.add('is-panel')
        document.documentElement.setAttribute('data-panel', PANEL)
      }

      const app = document.getElementById('app')
      const customStyle = document.getElementById('cp-custom-style')
      let cfg = {
        maxItems: 40,
        showFace: true,
        showMedal: true,
        showGift: true,
        showSuperchat: true,
        showMusic: true,
        musicPos: 'tl',
        musicQueueCount: 3,
        danmakuPos: 'br',
        // 界面整体大小 / 字体大小百分比。100 就是原始尺寸
        scale: 100,
        fontSize: 100,
        showLyric: true,
        lyricPos: 'bc',
        lyricLines: 2,
        // 观众搜音色时把候选摆出来。一次一条，默认 8 秒，多条排队
        showVoicePick: true,
        voicePickPos: 'tr',
        voicePickHits: 4,
        voicePickTtlMs: 8000,
        // 画面一窄就把三块分到互不相交的几段里，别压在彼此身上
        autoLayout: true,
        customCss: '',
        fontFamily: 'system-ui, "Microsoft YaHei", sans-serif',
        accent: '#D0BCFF',
      }

      /* 四个角。配置里若写了认不得的值就退回右下，别让 #app 落到一个没有样式的 data-pos 上 */
      const DANMAKU_POS = ['tl', 'tr', 'bl', 'br']
      // 歌词默认底部居中，像字幕；贴边时也能左右摆放
      const LYRIC_POS = ['tc', 'bc', 'tl', 'tr', 'bl', 'br']
      // 音色选择面板是个列表，居中不好看，只给四个角
      const PICK_POS = ['tl', 'tr', 'bl', 'br']

      function danmakuPos() {
        return DANMAKU_POS.indexOf(cfg.danmakuPos) >= 0 ? cfg.danmakuPos : 'br'
      }

      function lyricPos() {
        return LYRIC_POS.indexOf(cfg.lyricPos) >= 0 ? cfg.lyricPos : 'bc'
      }

      function pickPos() {
        return PICK_POS.indexOf(cfg.voicePickPos) >= 0 ? cfg.voicePickPos : 'tr'
      }

      /** 百分比 -> 倍率。留 0.5~2 的余量：再小看不见，再大出画 */
      function ratio(v) {
        const n = Number(v)
        if (!isFinite(n) || n <= 0) return 1
        return Math.min(2, Math.max(0.5, n / 100))
      }

      /** 与 --cp-u 同一个倍率。脚本里算「24u 到底是几像素」时要跟 CSS 对上 */
      let uiScale = 1

      function lyricLineCount() {
        const v = Number(cfg.lyricLines)
        if (!isFinite(v) || v < 1) return 2
        return Math.min(Math.floor(v), 5)
      }

      function applyConfig(c) {
        cfg = Object.assign(cfg, c || {})
        const root = document.documentElement
        root.style.setProperty('--cp-accent', cfg.accent)
        root.style.setProperty('--cp-font', cfg.fontFamily)
        // 界面整体缩放与字号缩放：前者乘所有尺寸，后者只再乘一次字号
        const ui = ratio(cfg.scale)
        uiScale = ui
        root.style.setProperty('--cp-u', ui + 'px')
        root.style.setProperty('--cp-fs', ui * ratio(cfg.fontSize) + 'px')
        customStyle.textContent = cfg.customCss || ''
        app.setAttribute('data-pos', danmakuPos())
        renderMusic()
        renderLyric()
        renderPick()
        // 配置一改位置就可能变，直接同步重排一次，别等下一帧（改完马上要看到效果）
        layout()
        fit()
      }

      /* ---------------------------- 点歌面板 ---------------------------- */

      const musicEl = document.getElementById('cp-music')
      let musicState = { current: null, items: [], queued: 0 }

      function el(tag, cls, text) {
        const n = document.createElement(tag)
        if (cls) n.className = cls
        if (text !== undefined && text !== null) n.textContent = text
        return n
      }

      function queueCount() {
        const v = Number(cfg.musicQueueCount)
        if (!isFinite(v) || v < 0) return 3
        return Math.min(Math.floor(v), 10)
      }

      function renderMusic() {
        // 这个源不负责点歌就整块不画（哪怕配置里开着）——
        // 拆开用的时候，主播是拿四个源各自摆位的，多画一块反而碍事
        if (!shows('music')) {
          musicEl.classList.remove('is-show')
          musicEl.textContent = ''
          return
        }
        const cur = musicState.current
        const items = (musicState.items || []).slice(0, queueCount())
        musicEl.setAttribute('data-pos', cfg.musicPos || 'tl')
        // 一首歌都没有就整块藏起来，别在画面上留一个空框
        const show = cfg.showMusic !== false && (cur || items.length > 0)
        musicEl.classList.toggle('is-show', Boolean(show))
        if (!show) {
          musicEl.textContent = ''
          scheduleLayout()
          return
        }

        musicEl.textContent = ''
        if (cur) {
          const card = el('div', 'cp-mcard')
          const cover = el('div', 'cp-mcover')
          if (cur.picUrl) {
            const img = el('img')
            img.src = cur.picUrl
            img.alt = ''
            cover.appendChild(img)
          } else {
            cover.appendChild(el('span', 'cp-mcover__none', '♪'))
          }
          card.appendChild(cover)
          const body = el('div', 'cp-mbody')
          body.appendChild(el('div', 'cp-mlabel', '正在播放'))
          body.appendChild(el('div', 'cp-mtitle', cur.name || '未命名'))
          const sub = [cur.artists, cur.requester ? cur.requester + ' 点的' : ''].filter(Boolean).join(' · ')
          body.appendChild(el('div', 'cp-msub', sub || '—'))
          card.appendChild(body)
          musicEl.appendChild(card)
        }
        if (items.length) {
          const box = el('div', 'cp-mqueue')
          box.appendChild(el('div', 'cp-mlabel cp-mqueue__head', '待播 ' + (musicState.queued || items.length) + ' 首'))
          items.forEach((it, i) => {
            const row = el('div', 'cp-mrow')
            row.appendChild(el('span', 'cp-mrow__no', String(i + 1)))
            row.appendChild(el('span', 'cp-mrow__name', it.name || '未命名'))
            row.appendChild(el('span', 'cp-mrow__who', it.requester || ''))
            box.appendChild(row)
          })
          musicEl.appendChild(box)
        }
        scheduleLayout()
      }

      /* ---------------------------- 歌词 ---------------------------- */

      const lyricEl = document.getElementById('cp-lyric')
      let lyricState = { songId: 0, lines: [], times: [], index: -1, playing: false }

      function renderLyric() {
        if (!shows('lyric')) {
          lyricEl.classList.remove('is-show')
          lyricEl.textContent = ''
          return
        }
        lyricEl.setAttribute('data-pos', lyricPos())
        const hasLines = lyricState.lines && lyricState.lines.length > 0
        const show = cfg.showLyric !== false && hasLines
        lyricEl.classList.toggle('is-show', Boolean(show))
        if (!show) {
          lyricEl.textContent = ''
          scheduleLayout()
          return
        }

        const want = lyricLineCount()
        const total = lyricState.lines.length
        // index 为 -1 说明前奏还没唱到第一句，先摆第一行顶着
        const from = Math.max(0, Math.min(lyricState.index < 0 ? 0 : lyricState.index, total - 1))

        lyricEl.textContent = ''
        let drawn = 0
        for (let i = from; i < total && drawn < want; i++) {
          const text = lyricState.lines[i]
          // 歌词里常见的空行是分段标记，画出来会在画面上留一块空白
          if (!String(text || '').trim()) continue
          const line = el('div', 'cp-lyric__line', text)
          if (i === lyricState.index) line.classList.add('is-cur')
          lyricEl.appendChild(line)
          drawn++
        }
        scheduleLayout()
      }

      /* ------------------------ 音色选择面板 ------------------------
         观众发「#音色列表 关键词」时摆出来的候选。主进程那边持有整条队列
         （谁是当前、还剩几秒、后面排着几条），这里只管画推过来的那一帧。 */

      const pickEl = document.getElementById('cp-pick')
      let pickState = { panel: null, waiting: 0 }
      /** 上一次画的是哪一帧。同一张面板只是配置变了就别重建 —— 重建会把进度条从头再播一遍 */
      let pickDrawn = ''

      function pickHitCount() {
        const v = Number(cfg.voicePickHits)
        if (!isFinite(v) || v < 1) return 4
        return Math.min(Math.floor(v), 6)
      }

      function pickTtl() {
        const v = Number(cfg.voicePickTtlMs)
        return isFinite(v) && v >= 500 ? v : 8000
      }

      function renderPick() {
        if (!shows('voicepick')) {
          pickEl.classList.remove('is-show')
          pickEl.textContent = ''
          pickDrawn = ''
          return
        }
        pickEl.setAttribute('data-pos', pickPos())
        const p = pickState.panel
        const hits = p && Array.isArray(p.hits) ? p.hits.slice(0, pickHitCount()) : []
        const show = cfg.showVoicePick !== false && Boolean(p) && hits.length > 0
        pickEl.classList.toggle('is-show', Boolean(show))
        if (!show) {
          pickEl.textContent = ''
          pickDrawn = ''
          scheduleLayout()
          return
        }

        const key = [p.id, p.picked, p.failed || '', hits.length, pickState.waiting].join('|')
        if (key === pickDrawn) {
          scheduleLayout()
          return
        }
        pickDrawn = key

        pickEl.textContent = ''
        const card = el('div', 'cp-pick__card')

        const head = el('div', 'cp-pick__head')
        head.appendChild(el('span', 'cp-pick__who', p.who ? p.who + ' 在选音色' : '有人在选音色'))
        if (p.keyword) head.appendChild(el('span', 'cp-pick__kw', '「' + p.keyword + '」'))
        card.appendChild(head)

        hits.forEach((h) => {
          const row = el('div', 'cp-pick__row')
          if (h.n === p.picked) row.classList.add('is-picked')
          if (h.disabled) row.classList.add('is-off')
          row.appendChild(el('span', 'cp-pick__no', String(h.n)))
          row.appendChild(el('span', 'cp-pick__name', h.name || '未命名'))
          row.appendChild(el('span', 'cp-pick__meta', h.hint || h.source || ''))
          if (h.disabled) row.appendChild(el('span', 'cp-pick__tag is-off', '已停用'))
          else if (h.registered) row.appendChild(el('span', 'cp-pick__tag', '已注册'))
          // 选中的那条再点一个勾，光靠底色在小画面上不够显眼
          if (h.n === p.picked) row.appendChild(el('span', 'cp-pick__ok', '✓ 已绑定'))
          card.appendChild(row)
        })

        if (p.failed) card.appendChild(el('div', 'cp-pick__fail', '没换成：' + p.failed))
        if (pickState.waiting > 0) {
          card.appendChild(el('div', 'cp-pick__wait', '后面还有 ' + pickState.waiting + ' 位在等'))
        }

        const bar = el('div', 'cp-pick__bar')
        const fill = el('div', 'cp-pick__bar-fill')
        fill.style.animationDuration = pickTtl() + 'ms'
        bar.appendChild(fill)
        card.appendChild(bar)

        pickEl.appendChild(card)
        scheduleLayout()
      }

      /* ---------------------------- 自动避让 ----------------------------
         三块（弹幕 / 点歌 / 歌词）各自 fixed 在自己的角上。窗口一窄 ——
         比如把 OBS 浏览器源拖成一条竖带 —— 它们就会压成一坨：弹幕糊在
         歌词和点歌面板上，谁也看不清。
         这趟先撤掉上一轮的偏移、按配置摆好，量出各自真实占位，再把同一侧
         且水平上确实打架的两块上下叠开，最后把弹幕的活动区缩进剩下的那一段。
         宽画面下三块各占一角、互不相干，这一趟就什么都不改 ——
         所以它是「自动」的：不用为了窄条单独配一套位置。 */

      const NARROW_W = 640 // 比这窄（或比 NARROW_H 还矮）就按「窄画面」处理
      const NARROW_H = 540
      let layoutRaf = 0

      /**
       * 量一块的真实占位。用 offset* 而不是 getBoundingClientRect ——
       * 入场动画是 transform 位移，rect 会被带着飘，量出来的水平位置忽左忽右。
       * 居中的两块靠 translateX(-50%) 归位，offsetLeft 还是没归位之前的值，手动折回去。
       */
      function boxOf(node, centered) {
        if (!node.classList.contains('is-show')) return null
        const width = node.offsetWidth
        const height = node.offsetHeight
        if (!width && !height) return null
        const left = node.offsetLeft - (centered ? width / 2 : 0)
        return { left: left, right: left + width, width: width, height: height }
      }

      /**
       * 水平上是不是真挨着。只差半像素的重叠不算 ——
       * 不然浮点误差会让「各占一角」的三块老被当成打架，白白挪位置。
       * @param {number} left 待判定的那块的左边
       * @param {number} right 已经收进这一竖带的所有块的最右边
       */
      function touchesX(left, right) {
        return left < right - 0.5
      }

      function isTopSide(pos, tops) {
        return tops.indexOf(pos) >= 0
      }

      function clearOffsets() {
        app.style.top = ''
        app.style.bottom = ''
        musicEl.style.top = ''
        musicEl.style.bottom = ''
        lyricEl.style.top = ''
        lyricEl.style.bottom = ''
        pickEl.style.top = ''
        pickEl.style.bottom = ''
      }

      /** 贴在画布上半区的四个位置。tc/bc 是歌词专有的，不算 */
      const TOP_SIDE = ['tl', 'tr']

      function layout() {
        clearOffsets()
        // 挂在 <html> 上：CSS 里那几条 .is-narrow 规则要连点歌面板、歌词一起管。
        // 除了「窄」，矮也算 —— 1920×400 这种横条一样会挤。
        const tight = window.innerWidth < NARROW_W || window.innerHeight < NARROW_H
        document.documentElement.classList.toggle('is-narrow', tight)
        // 拆开用的源里只有一块，没有「别压到谁身上」这回事 ——
        // 也不该把 #app 缩进去（那本来是给同侧别的块腾地方的）
        if (ONLY) return
        if (cfg.autoLayout === false) return

        const pad = 24 * uiScale
        const gap = 12 * uiScale
        const lpos = lyricPos()
        // 同一侧、水平上真的挨着的那几块才需要上下叠开。
        // rank 决定谁贴边：歌词永远在最外（像字幕），音色面板次之，点歌面板让到最内。
        const blocks = []
        const m = boxOf(musicEl, false)
        if (m) blocks.push({ el: musicEl, box: m, top: isTopSide(cfg.musicPos || 'tl', TOP_SIDE), rank: 2 })
        const l = boxOf(lyricEl, lpos === 'tc' || lpos === 'bc')
        if (l) blocks.push({ el: lyricEl, box: l, top: isTopSide(lpos, ['tc', 'tl', 'tr']), rank: 0 })
        const k = boxOf(pickEl, false)
        if (k) blocks.push({ el: pickEl, box: k, top: isTopSide(pickPos(), TOP_SIDE), rank: 1 })

        // 每侧算两件事：每条竖带里各块摞起来的位置，以及这一侧总共要预留多高。
        // 预留高度 = 该侧最高的那条竖带（#app 自己带 24u 内边距，所以要从这里再让出去）
        let topBand = 0
        let botBand = 0
        for (const top of [true, false]) {
          const side = blocks.filter((b) => b.top === top).sort((a, b) => a.box.left - b.box.left)
          let band = 0
          let i = 0
          while (i < side.length) {
            // 一"竖带"：从这一块起，凡是跟它水平上挨着的都收进来
            const group = [side[i]]
            let right = side[i].box.right
            i++
            while (i < side.length && touchesX(side[i].box.left, right)) {
              group.push(side[i])
              right = Math.max(right, side[i].box.right)
              i++
            }
            group.sort((a, b) => a.rank - b.rank)
            let cursor = pad
            let used = 0
            for (const b of group) {
              if (top) b.el.style.top = cursor + 'px'
              else b.el.style.bottom = cursor + 'px'
              cursor += b.box.height + gap
              used += b.box.height + gap
            }
            band = Math.max(band, used - gap)
          }
          if (top) topBand = band
          else botBand = band
        }

        // #app 自己带 24u 内边距，所以从这里再让出「块高 + 一个间距」就够了
        if (topBand > 0) app.style.top = topBand + gap + 'px'
        if (botBand > 0) app.style.bottom = botBand + gap + 'px'
      }

      /**
       * 现有气泡摞起来有多高（含行间距）。
       * 不能用 scrollHeight —— #app 是 justify-content: flex-end，超出去的那几条堆在
       * flex-start 这一头，浏览器认为那是「滚动不可达」的部分，scrollHeight 根本不计。
       */
      function stackHeight() {
        const n = app.children.length
        if (!n) return 0
        let h = 0
        for (let i = 0; i < n; i++) h += app.children[i].offsetHeight
        return h + 8 * uiScale * (n - 1)
      }

      /** 弹幕还是塞不下就别硬挤：从离角落最远的那条（DOM 里排最前）开始删 */
      function fit() {
        let guard = 0
        const inner = app.clientHeight
        while (app.children.length > 1 && stackHeight() > inner + 1 && guard++ < 200) {
          app.removeChild(app.firstChild)
        }
      }

      /** 合并到下一帧再量：一条弹幕进来就同步量一次布局，弹幕快了会拖帧 */
      function scheduleLayout() {
        if (layoutRaf) return
        layoutRaf = requestAnimationFrame(() => {
          layoutRaf = 0
          layout()
          fit()
        })
      }

      window.addEventListener('resize', () => {
        // 这里不走 rAF：OBS 里把源先藏起来时 rAF 是不跑的，
        // 拖完窗口再显示出来会停在旧尺寸上。resize 本来就不密集，同步做掉最省心
        layout()
        fit()
      })
      if (window.ResizeObserver) {
        // 换歌、换行数都会改这两块的高矮，光靠 resize 逮不到
        const ro = new ResizeObserver(scheduleLayout)
        ro.observe(musicEl)
        ro.observe(lyricEl)
        ro.observe(pickEl)
      }

      /**
       * 头像要从主进程带 Referer 抓回来才能显示 —— B站图床对非 bilibili 来源返回 403。
       * 原 URL -> data URL 记在这张表里，事件到达时可能还没解析完，所以 DOM 要留着批量回填。
       */
      const faceCache = {}

      function faceSrc(raw) {
        if (!raw) return ''
        if (raw.indexOf('data:') === 0) return raw
        return faceCache[raw] || ''
      }

      function applyFacePatch(src, data) {
        if (!src || !data) return
        faceCache[src] = data
        const nodes = app.querySelectorAll('img[data-face="' + cssEscape(src) + '"]')
        for (let i = 0; i < nodes.length; i++) {
          nodes[i].src = data
          nodes[i].classList.remove('cp-face--none')
        }
      }

      function cssEscape(s) {
        return String(s).replace(/["\\]/g, '\\$&')
      }

      function trim() {
        while (app.children.length > cfg.maxItems) app.removeChild(app.firstChild)
      }

      function renderEmots(text, emots) {
        if (!emots) return null
        const frag = document.createDocumentFragment()
        const re = /\[([^\]]{1,12})\]/g
        let last = 0
        let m
        let hit = false
        while ((m = re.exec(text))) {
          if (m.index > last) frag.appendChild(document.createTextNode(text.slice(last, m.index)))
          const e = emots[m[1]]
          if (e && e.url) {
            hit = true
            const img = document.createElement('img')
            img.src = e.url
            img.alt = m[1]
            frag.appendChild(img)
          } else {
            frag.appendChild(document.createTextNode(m[0]))
          }
          last = m.index + m[0].length
        }
        if (!hit) return null
        if (last < text.length) frag.appendChild(document.createTextNode(text.slice(last)))
        return frag
      }

      function addItem(ev) {
        // 歌词源 / 点歌源里不该冒出弹幕
        if (!shows('danmaku')) return
        if (ev.type === 'gift' && !cfg.showGift) return
        if (ev.type === 'superchat' && !cfg.showSuperchat) return
        if (ev.type === 'enter' || ev.type === 'live' || ev.type === 'offline') return

        const el = document.createElement('div')
        el.className = 'cp-item'
        if (ev.type === 'gift') el.classList.add('is-gift')
        if (ev.type === 'guard') el.classList.add('is-guard')
        if (ev.type === 'superchat') el.classList.add('is-superchat')

        if (cfg.showFace) {
          if (ev.face) {
            const img = document.createElement('img')
            img.className = 'cp-face'
            // 先记原 URL 便于回填；解析没到位的先用占位，避免 403 打穿 <img>
            img.setAttribute('data-face', ev.face)
            const ready = faceSrc(ev.face)
            if (ready) img.src = ready
            else img.classList.add('cp-face--none')
            img.onerror = () => img.classList.add('cp-face--none')
            el.appendChild(img)
          } else {
            const ph = document.createElement('div')
            ph.className = 'cp-face cp-face--none'
            ph.textContent = (ev.username || '?').slice(0, 1)
            el.appendChild(ph)
          }
        }

        const body = document.createElement('div')
        body.className = 'cp-body'

        const head = document.createElement('div')
        head.className = 'cp-head'
        const name = document.createElement('span')
        name.className = 'cp-name'
        name.textContent = ev.username || '观众'
        head.appendChild(name)

        if (cfg.showMedal && ev.medal && ev.medal.name) {
          const medal = document.createElement('span')
          medal.className = 'cp-medal'
          medal.textContent = ev.medal.name + ' · ' + ev.medal.level
          head.appendChild(medal)
        }
        if (ev.price) {
          const price = document.createElement('span')
          price.className = 'cp-price'
          price.textContent = '¥' + ev.price
          head.appendChild(price)
        }
        body.appendChild(head)

        const text = document.createElement('div')
        text.className = 'cp-text'
        if (ev.emojiUrl) {
          const img = document.createElement('img')
          img.src = ev.emojiUrl
          img.style.height = '40px'
          text.appendChild(img)
        } else {
          const frag = renderEmots(ev.content || '', ev.emots)
          if (frag) text.appendChild(frag)
          else text.textContent = ev.content || ''
        }
        body.appendChild(text)
        el.appendChild(body)
        app.appendChild(el)
        trim()
        scheduleLayout()
      }

      let ws
      let retry = 0
      let statusTimer = null

      const statusEl = document.getElementById('cp-status')
      function setStatus(text, bad, autoHideMs) {
        if (statusTimer) {
          clearTimeout(statusTimer)
          statusTimer = null
        }
        if (!text) {
          statusEl.classList.remove('is-show')
          return
        }
        // 拆开用的时候四个源各弹一句「已连接」，会叠在同一处看起来像出了故障。
        // 所以那一类就只留「出错」这一种 —— 断线本来也是要立刻看见的。
        if (ONLY && !bad) {
          statusEl.classList.remove('is-show')
          return
        }
        statusEl.textContent = text
        statusEl.classList.toggle('is-bad', Boolean(bad))
        statusEl.classList.add('is-show')
        if (autoHideMs) statusTimer = setTimeout(() => statusEl.classList.remove('is-show'), autoHideMs)
      }

      function connect() {
        setStatus(retry === 0 ? '叠加层连接中…' : `叠加层重连中（第 ${retry} 次）…`, true)
        ws = new WebSocket(`ws://${location.host}/ws`)
        ws.onopen = () => {
          retry = 0
          setStatus('叠加层已连接', false, 3000)
        }
        ws.onmessage = (e) => {
          try {
            const msg = JSON.parse(e.data)
            if (msg.type === 'hello') applyConfig(msg.payload && msg.payload.overlay)
            else if (msg.type === 'config') applyConfig(msg.payload)
            else if (msg.type === 'event') addItem(msg.payload)
            else if (msg.type === 'music') {
              musicState = msg.payload || { current: null, items: [], queued: 0 }
              renderMusic()
            } else if (msg.type === 'face') applyFacePatch(msg.payload.src, msg.payload.data)
            else if (msg.type === 'lyric') {
              // 逐字段取值而不是 Object.assign：换歌那一帧刻意不带 lines（让它先清空），
              // 合并的话旧歌词会赖着不走，出现「新歌配旧词」
              const p = msg.payload || {}
              const songId = Number(p.songId) || 0
              // 最后一道闸：这帧挂着的歌和正在放的那首对不上，整帧丢掉。
              // 投递顺序上它不该出现 —— 真出现了说明上游哪里又漏了，
              // 那也宁可在台上空几秒，别把上一首的词挂到这首名下（观众一眼就看出来了）。
              const now = musicState.current ? Number(musicState.current.id) || 0 : 0
              if (songId && now && songId !== now) return
              lyricState = {
                songId,
                lines: Array.isArray(p.lines) ? p.lines : [],
                times: Array.isArray(p.times) ? p.times : [],
                index: Number.isFinite(p.index) ? p.index : -1,
                playing: Boolean(p.playing),
              }
              renderLyric()
            }
            else if (msg.type === 'voicepick') {
              // 逐字段取值：panel 为 null 就是「现在没人在选」，得把面板收掉
              const p = msg.payload || {}
              pickState = {
                panel: p.panel || null,
                waiting: Number(p.waiting) || 0,
              }
              renderPick()
            }
            else if (msg.type === 'faces') {
              // 迟到的客户端补发：先把映射灌进表，再回填已经渲染出来的那些
              const list = msg.payload || []
              for (let i = 0; i < list.length; i++) faceCache[list[i].src] = list[i].data
              const imgs = app.querySelectorAll('img[data-face]')
              for (let i = 0; i < imgs.length; i++) {
                const ready = faceSrc(imgs[i].getAttribute('data-face'))
                if (ready) {
                  imgs[i].src = ready
                  imgs[i].classList.remove('cp-face--none')
                }
              }
            }
          } catch (err) {
            /* 忽略脏数据 */
          }
        }
        ws.onclose = () => {
          retry++
          setStatus('叠加层已断开，正在重连…', true)
          setTimeout(connect, Math.min(1000 * retry, 8000))
        }
        ws.onerror = () => {
          /* onclose 会跟着触发，状态提示统一在那里更新 */
        }
      }
      connect()
    </script>
  </body>
</html>
